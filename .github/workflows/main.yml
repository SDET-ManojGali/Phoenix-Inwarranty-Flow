name : Postman Collection Workflow
on:
  push:
    branches: [main]
  workflow_dispatch: 
  schedule:
    - cron: 30 01 * * *
    - cron: 30 02 * * *  
jobs:
  run-postman-tests:
    runs-on: ec2-github-runner

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Install Node Js & npm
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
      - name: Install newman and htmlextra globally
        run: |
             npm install -g newman
             npm install -g newman-reporter-htmlextra
      - name: Run the postman collection with newman
        run: |
             newman run 'Inwarranty-flow Collection.postman_collection.json' \
             -e QA.postman_environment.json \
             -d testData.csv \
             -r cli,htmlextra \
             --reporter-htmlextra-export ./newman/index.html
             
      - name: Newman Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Newman Report
          path: newman/*.html
         
      - name: Creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/
          
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix Inwarranty Flow Test Execution Notification
          to: manojgmanoj3076@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
                Hi,
                Phoenix Inwarranty Flow tests has been executed. the report has been published and the URL is:
                https://sdet-manojgali.github.io/Phoenix-Inwarranty-Flow/
          
          
          
          
          
